# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# Configured for Arctos stepper engine with 200kHz timer, 16x microstepping
# Max step rate: 50,000 steps/s (GRBL_MIN_CYCLES_PER_STEP = 4 for 10µs pulse width)
# Reduced from 100kHz to avoid resonance frequencies and ensure stable pulse detection
# Calculations based on gear ratios from arctos_motor_config.h
# 
# Velocity scaling: Increased for faster movement
# Acceleration scaling: Increased for quicker response
default_velocity_scaling_factor: 0.9
default_acceleration_scaling_factor: 0.8

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  # Wrist joints (NEMA17, Gear Ratio 36:1, 18,335 steps/rad)
  # Resonance zone: ~30,000-50,000 steps/s - stay below with safety margin
  A_joint:
    has_position_limits: true
    min_position: -1.40                # -80 degrees = -80° * π/180 ≈ -1.40 rad
    max_position: 1.40                 # +80 degrees = +80° * π/180 ≈ +1.40 rad
    has_velocity_limits: true
    max_velocity: 1.57                 # 1.57 rad/s = 28,800 steps/s (below resonance)
    has_acceleration_limits: true
    max_acceleration: 4.71             # 4.71 rad/s² = 86,400 steps/s²
  B_joint:
    has_position_limits: true
    min_position: -1.40                # -80 degrees = -80° * π/180 ≈ -1.40 rad
    max_position: 1.40                 # +80 degrees = +80° * π/180 ≈ +1.40 rad
    has_velocity_limits: true
    max_velocity: 1.57                 # 1.57 rad/s = 28,800 steps/s (below resonance)
    has_acceleration_limits: true
    max_acceleration: 4.71             # 4.71 rad/s²
  C_joint:
    has_position_limits: true
    min_position: -3.14                # -180 degrees = -π rad
    max_position: 3.14                 # +180 degrees = +π rad
    has_velocity_limits: true
    max_velocity: 2.36                 # 2.36 rad/s = 43,200 steps/s (tool rotation, slightly faster)
    has_acceleration_limits: true
    max_acceleration: 6.28             # 6.28 rad/s²
  
  # Gripper joints (not connected to stepper engine)
  Left_jaw_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: false
    max_acceleration: 0
  Right_jaw_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: false
    max_acceleration: 0
  
  # Base joint (NEMA23, Gear Ratio 13.5:1, 6,875 steps/rad)
  # Resonance zone: ~20,000-40,000 steps/s - stay below
  X_joint:
    has_position_limits: true
    min_position: -3.14                # -180 degrees = -π rad
    max_position: 3.14                 # +180 degrees = +π rad
    has_velocity_limits: true
    max_velocity: 2.62                 # 2.62 rad/s = 18,000 steps/s (below resonance)
    has_acceleration_limits: true
    max_acceleration: 5.24             # 5.24 rad/s² = 36,000 steps/s²
  
  # Shoulder and Elbow joints (NEMA23, Gear Ratio 150:1, 76,394 steps/rad)
  # High gear ratio pushes resonance higher, 50kHz limit is safe
  Y_joint:
    has_velocity_limits: true
    max_velocity: 1.0                  # 1.0 rad/s = 76,394 steps/s (faster movement)
    has_acceleration_limits: true
    max_acceleration: 3.14             # 3.14 rad/s² = 240,000 steps/s²
  Z_joint:
    has_velocity_limits: true
    max_velocity: 1.0                  # 1.0 rad/s = 76,394 steps/s (faster movement)
    has_acceleration_limits: true
    max_acceleration: 3.14             # 3.14 rad/s²