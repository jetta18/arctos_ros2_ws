# ros2_control controller and controller_manager parameters

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz - Further reduced to prevent motor overload

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arctos_position_controller:
      type: position_controllers/JointGroupPositionController

    arctos_controller:
      type: "joint_trajectory_controller/JointTrajectoryController"

arctos_position_controller:
  ros__parameters:
    joints:
      - X_joint
      - Y_joint
      - Z_joint
      - A_joint
      - B_joint
      - C_joint
    # Für JointGroupPositionController reicht das i.d.R.
    # (er nutzt immer die position-Command-Interfaces)

arctos_controller:
  ros__parameters:
    joints:
      - X_joint
      - Y_joint
      - Z_joint
      - A_joint
      - B_joint
      - C_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

    # Controller configuration
    action_monitor_rate: 100.0  # Reduced for stability
    allow_integration_in_goal_trajectories: false
    allow_nonzero_velocity_at_trajectory_end: true  # Allow velocity to continue until goal reached
    allow_partial_joints_goal: false
    open_loop_control: true
    # set_last_command_interface_value_as_state_on_activation: true
    
    # Publishing rates
    state_publish_rate: 100.0  # Match controller update rate
    
    # Timeout settings
    cmd_timeout: 0.0
    
    interpolation_method: "splines"
    
    # Constraints and tolerances - enable goal tolerances
    constraints:
      stopped_velocity_tolerance: 0.01  # Consider stopped when velocity < 0.01 rad/s
      goal_time: 15.0  # Allow 15 seconds to reach goal
      X_joint:
        trajectory: -1.0  # Disabled - unrestricted movement
        goal: 0.01       # 0.01 rad tolerance (~0.6°)
      Y_joint:
        trajectory: -1.0  # Disabled - unrestricted movement
        goal: 0.01       # 0.01 rad tolerance (~0.6°)
      Z_joint:
        trajectory: -1.0  # Disabled - unrestricted movement
        goal: 0.01       # 0.01 rad tolerance (~0.6°)
      A_joint:
        trajectory: -1.0  # Disabled - unrestricted movement
        goal: 0.01       # 0.01 rad tolerance (~0.6°)
      B_joint:
        trajectory: -1.0  # Disabled - unrestricted movement
        goal: 0.01       # 0.01 rad tolerance (~0.6°)
      C_joint:
        trajectory: -1.0  # Disabled - unrestricted movement
        goal: 0.01       # 0.01 rad tolerance (~0.6°)
